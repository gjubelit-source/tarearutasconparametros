<main>
<nav *ngIf="usuario; else usuarioNoExiste">

  <h3>ID: {{ usuario.id }}</h3>
  <h3>Nombre: {{ usuario.nombre }}</h3>
  <h3>Apellido: {{ usuario.apellido }}</h3>


  <button (click)="siguienteUsuario()">
    Siguiente 
  </button>

</nav>

<ng-template #usuarioNoExiste>
  <h2>Usuario no encontrado en el sistema</h2>
</ng-template>

<br>
<a routerLink="/usuarios">Volver a la lista de usuarios</a>
</main>
